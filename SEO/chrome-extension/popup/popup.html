<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3J SEO Analyzer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <header class="popup-header">
            <div class="logo">
                <img src="../icons/icon32.png" alt="3J SEO">
                <span>3J SEO Analyzer</span>
            </div>
            <button class="settings-btn" id="open-settings" title="Settings">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </header>

        <!-- Connection Status -->
        <div class="connection-status" id="connection-status">
            <div class="status-dot disconnected"></div>
            <span>Not connected</span>
        </div>

        <!-- Tab Navigation -->
        <nav class="tabs">
            <button class="tab active" data-tab="analyze">Analyze</button>
            <button class="tab" data-tab="keywords">Keywords</button>
            <button class="tab" data-tab="sites">Sites</button>
        </nav>

        <!-- Tab Content -->
        <main class="tab-content">
            <!-- Analyze Tab -->
            <div class="tab-panel active" id="tab-analyze">
                <div class="current-page" id="current-page">
                    <div class="page-info">
                        <span class="page-url" id="page-url">Loading...</span>
                    </div>
                    <button class="analyze-btn" id="analyze-current">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        Analyze Page
                    </button>
                </div>

                <!-- Analysis Results -->
                <div class="analysis-results" id="analysis-results" style="display: none;">
                    <div class="score-display">
                        <div class="score-circle" id="score-circle">
                            <span class="score-value" id="score-value">--</span>
                        </div>
                        <div class="score-grade" id="score-grade">--</div>
                    </div>

                    <div class="metrics-grid" id="metrics-grid">
                        <!-- Metrics will be inserted here -->
                    </div>

                    <div class="quick-actions">
                        <button class="action-btn" id="sync-to-wp" title="Sync to WordPress">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                            </svg>
                            Sync
                        </button>
                        <button class="action-btn" id="track-keyword" title="Track Keyword">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
                            </svg>
                            Track
                        </button>
                        <button class="action-btn" id="view-details" title="Full Report">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                            </svg>
                            Details
                        </button>
                    </div>
                </div>
            </div>

            <!-- Keywords Tab -->
            <div class="tab-panel" id="tab-keywords">
                <div class="add-keyword">
                    <input type="text" id="new-keyword" placeholder="Enter keyword to track...">
                    <button id="add-keyword-btn">+</button>
                </div>

                <div class="keywords-list" id="keywords-list">
                    <div class="empty-state">
                        <p>No keywords tracked yet</p>
                        <small>Add keywords to monitor their rankings</small>
                    </div>
                </div>
            </div>

            <!-- Sites Tab -->
            <div class="tab-panel" id="tab-sites">
                <div class="connect-site">
                    <input type="url" id="site-url" placeholder="WordPress site URL...">
                    <button id="connect-site-btn">Connect</button>
                </div>

                <div class="sites-list" id="sites-list">
                    <div class="empty-state">
                        <p>No sites connected</p>
                        <small>Connect your WordPress site with WP Bulk SEO plugin</small>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="popup-footer">
            <a href="https://3jlabs.com/wp-bulk-seo" target="_blank">Documentation</a>
            <span class="version">v1.0.0</span>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
